name: EcoDrug CI/CD - Full Test Suite

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  # ==========================================
  # JOB 1: Backend Tests (Node.js + MongoDB)
  # ==========================================
  backend-tests:
    name: Backend Tests (Node.js ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [18.x, 20.x]
    
    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      
      - name: Install backend dependencies
        working-directory: ./backend
        run: npm ci
      
      - name: Run backend tests
        working-directory: ./backend
        env:
          NODE_ENV: test
          MONGO_URI: mongodb://localhost:27017/ecodrug_test
          JWT_SECRET: test_jwt_secret_key_for_ci
        run: npm test -- --coverage
      
      - name: Upload backend coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./backend/coverage/lcov.info
          flags: backend
          name: backend-coverage

  # ==========================================
  # JOB 2: Frontend Tests (Flutter)
  # ==========================================
  frontend-tests:
    name: Frontend Tests (Flutter)
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.16.0'
          channel: 'stable'
      
      - name: Install frontend dependencies
        working-directory: ./frontend
        run: flutter pub get
      
      - name: Run Flutter analyzer
        working-directory: ./frontend
        run: flutter analyze
      
      - name: Run frontend tests
        working-directory: ./frontend
        run: flutter test --coverage
      
      - name: Upload frontend coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./frontend/coverage/lcov.info
          flags: frontend
          name: frontend-coverage

  # ==========================================
  # JOB 3: Security Audit
  # ==========================================
  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
      
      - name: Backend npm audit
        working-directory: ./backend
        run: npm audit --audit-level=high || true
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.16.0'
      
      - name: Frontend dependencies check
        working-directory: ./frontend
        run: flutter pub outdated || true

  # ==========================================
  # JOB 4: Docker Build Test
  # ==========================================
  docker-build:
    name: Docker Build Test
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Validate docker-compose
        run: docker-compose config
      
      - name: Build backend image
        run: docker build -t ecodrug-backend:test ./backend
      
      - name: Build frontend image
        run: docker build -t ecodrug-frontend:test ./frontend

  # ==========================================
  # JOB 5: All Tests Passed
  # ==========================================
  all-tests-passed:
    name: All Tests Passed ✅
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests, security-audit, docker-build]
    
    steps:
      - name: Success message
        run: |
          echo "🎉 All tests passed successfully!"
          echo "✅ Backend tests: OK"
          echo "✅ Frontend tests: OK"
          echo "✅ Security audit: OK"
          echo "✅ Docker build: OK"
