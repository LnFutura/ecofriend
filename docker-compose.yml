version: '3.8'

services:
  # MongoDB Database
  mongodb:
    image: mongo:7.0
    container_name: ecodrug-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin123
      MONGO_INITDB_DATABASE: ecodrug
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
      - ./mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    networks:
      - ecodrug-network

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ecodrug-backend
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 3001
      MONGO_URI: mongodb://admin:admin123@mongodb:27017/ecodrug?authSource=admin
      JWT_SECRET: your_super_secret_jwt_key_change_this_in_production_12345
      JWT_EXPIRE: 7d
      CLIENT_URL: http://localhost:8080
    ports:
      - "3001:3001"
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      - mongodb
    networks:
      - ecodrug-network
    command: npm run dev

  # Frontend (Flutter Web) - для разработки запускаем локально
  # Раскомментируйте, если хотите запустить frontend в Docker
  # frontend:
  #   build:
  #     context: ./frontend
  #     dockerfile: Dockerfile
  #   container_name: ecodrug-frontend
  #   restart: unless-stopped
  #   ports:
  #     - "3000:3000"
  #   volumes:
  #     - ./frontend:/app
  #   depends_on:
  #     - backend
  #   networks:
  #     - ecodrug-network

networks:
  ecodrug-network:
    driver: bridge

volumes:
  mongodb_data:
    driver: local

